# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Config de Sveltia CMS. Doc: https://sveltiacms.app/en/docs/

backend:
  name: github
  repo: jose-mizdraji/portfolio
  branch: main

media_folder: assets/images
public_folder: /portfolio/assets/images

slug:
  encoding: unicode
  clean_accents: false

collections:

  # ─────────────────────────────────────────────────────────────────────
  # OBRAS
  # ─────────────────────────────────────────────────────────────────────
  - name: obras
    label: Obras
    icon: palette
    files:
      - name: obras
        label: Catálogo de obras
        file: data/obras.json
        media_folder: assets/images/obras
        public_folder: /portfolio/assets/images/obras
        fields:
          - label: Obras
            name: obras
            widget: list
            summary: "{{titulo}} — {{categoria}} ({{año}})"
            fields:
              - label: "ID único (sin espacios ni tildes, ej: retrato-ibera-2026)"
                name: id
                widget: string
                pattern: ["^[a-z0-9-]+$", "Solo minúsculas, números y guiones"]
              - { label: Título, name: titulo, widget: string }
              - { label: Categoría, name: categoria, widget: select, options: [Pinturas, Dibujos, Grabados, Esculturas] }
              - { label: Año, name: año, widget: number, value_type: int }
              - { label: Técnica, name: tecnica, widget: string }
              - { label: Materiales, name: materiales, widget: string }
              - { label: Medidas, name: medidas, widget: string }
              - { label: Serie, name: serie, widget: string, required: false }
              - { label: Descripción, name: descripcion, widget: text }
              - { label: Estado, name: estado, widget: select, options: [disponible, vendida, reservada] }
              - { label: "Precio en USD (opcional)", name: precio, widget: number, value_type: float, required: false }
              - { label: "Mostrar precio en el sitio", name: mostrarPrecio, widget: boolean, default: false }
              - label: "Imagen principal"
                name: imagenPrincipal
                widget: image
                hint: "JPG o PNG. Recomendado: 1200×900px, menos de 1MB."
              - label: "Galería (fotos adicionales)"
                name: galeria
                widget: list
                required: false
                field:
                  label: Imagen
                  name: imagen
                  widget: image
              - { label: "Fecha de carga", name: fechaCarga, widget: datetime, required: false }

  # ─────────────────────────────────────────────────────────────────────
  # INICIO Y TRAYECTORIA
  # ─────────────────────────────────────────────────────────────────────
  - name: bio
    label: Inicio y Trayectoria
    icon: person
    files:
      - name: bio
        label: Imágenes del inicio y datos biográficos
        file: data/bio.json
        fields:
          - { label: Nombre completo, name: nombre, widget: string }
          - { label: "Subtítulo", name: subtitulo, widget: string }
          - { label: "Lugar y fecha de nacimiento", name: nacimiento, widget: string, required: false }
          - { label: "Título profesional", name: tituloProfesional, widget: string, required: false }

          - label: "Imagen hero (fondo grande del inicio)"
            name: imagenHero
            widget: image
            required: false
            hint: "Horizontal, 1600×900px o más, JPG."

          - label: "Foto de perfil del artista"
            name: fotoPerfil
            widget: image
            required: false
            hint: "Cuadrada, 600×600px mínimo, JPG."

          - label: "Texto introductorio del inicio"
            name: textoInicio
            widget: text
            required: false

          - label: "Imágenes de las 4 categorías (tarjetas del inicio)"
            name: imagenesCategorias
            widget: object
            required: false
            fields:
              - { label: "Pinturas",   name: Pinturas,   widget: image, required: false }
              - { label: "Dibujos",    name: Dibujos,    widget: image, required: false }
              - { label: "Grabados",   name: Grabados,   widget: image, required: false }
              - { label: "Esculturas", name: Esculturas, widget: image, required: false }

          - label: "Biografía"
            name: biografia
            widget: text

          - label: "Formación, becas y clínicas"
            name: formacion
            widget: list
            summary: "{{año}} — {{titulo}}"
            fields:
              - { label: Año,          name: año,         widget: string, required: false }
              - { label: Título,       name: titulo,      widget: string }
              - { label: Institución,  name: institucion, widget: string, required: false }

          - label: Premios y distinciones
            name: premios
            widget: list
            summary: "{{año}} — {{titulo}}"
            fields:
              - { label: Año,    name: año,   widget: string, required: false }
              - { label: Título, name: titulo, widget: string }
              - { label: Lugar,  name: lugar,  widget: string, required: false }

          - label: Exposiciones individuales
            name: exposicionesIndividuales
            widget: list
            summary: "{{año}} — {{titulo}}"
            fields:
              - { label: Año,    name: año,   widget: string, required: false }
              - { label: Título, name: titulo, widget: string }
              - { label: Lugar,  name: lugar,  widget: string, required: false }

          - label: Exposiciones colectivas
            name: exposicionesColectivas
            widget: list
            summary: "{{año}} — {{titulo}}"
            fields:
              - { label: Año,    name: año,   widget: string, required: false }
              - { label: Título, name: titulo, widget: string }
              - { label: Lugar,  name: lugar,  widget: string, required: false }

          - label: "Colecciones (museos con obra en su acervo)"
            name: colecciones
            widget: list
            required: false
            field: { label: Colección, name: coleccion, widget: string }

          - label: Publicaciones
            name: publicaciones
            widget: list
            required: false
            summary: "{{año}} — {{titulo}}"
            fields:
              - { label: Año,       name: año,       widget: string, required: false }
              - { label: Título,    name: titulo,    widget: string }
              - { label: Editorial, name: editorial, widget: string, required: false }
              - { label: Lugar,     name: lugar,     widget: string, required: false }

  # ─────────────────────────────────────────────────────────────────────
  # CONTACTO
  # ─────────────────────────────────────────────────────────────────────
  - name: contacto
    label: Contacto
    icon: mail
    files:
      - name: contacto
        label: Datos de contacto
        file: data/contacto.json
        fields:
          - { label: Email,       name: email,     widget: string, required: false }
          - { label: Instagram,   name: instagram, widget: string, required: false }
          - { label: Facebook,    name: facebook,  widget: string, required: false }
          - { label: WhatsApp,    name: whatsapp,  widget: string, required: false }
          - { label: Ubicación,   name: direccion, widget: string, required: false }
