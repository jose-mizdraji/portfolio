<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">

  <title>José Mizdraji — Artista Visual</title>
  <meta name="description" content="Portafolio oficial de José Mizdraji, artista visual correntino. Pintura, dibujo, grabado y escultura.">
  <meta property="og:title" content="José Mizdraji — Artista Visual">
  <meta property="og:description" content="Portafolio oficial de José Mizdraji, artista visual correntino.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://jose-mizdraji.github.io/portfolio/assets/images/og.jpg">

  <meta property="og:locale" content="es_AR">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://jose-mizdraji.github.io/portfolio/">
  <!-- Íconos: detalle del nido (identidad visual de José). Archivos en assets/icons/ -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

  <!--
    Content-Security-Policy vía meta tag (GitHub Pages no permite headers
    HTTP custom, así que esta es la única forma disponible sin dominio propio
    detrás de un proxy). Limitación conocida: la directiva frame-ancestors NO
    funciona en un <meta> tag (los navegadores la ignoran ahí a propósito) —
    si en algún momento la protección anti-clickjacking importa de verdad,
    hace falta un dominio propio servido por algo que sí mande headers reales
    (p. ej. Cloudflare delante de GitHub Pages).

    Todo el JavaScript es propio ('self'): incluida la librería de PDF, que
    está copiada en js/vendor/ en vez de cargarse desde un CDN.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self' mailto:;
  ">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>

          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="mobile-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app-main">
